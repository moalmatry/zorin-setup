[general]
reaper_freq=5
desiredgov=performance
igpu_desiredgov=powersave
igpu_power_threshold=0.3
softrealtime=auto
renice=0
ioprio=0
inhibit_screensaver=1
disable_splitlock=1

[custom]
start=notify-send "GameMode Active" "System switched to high performance gaming profile." -i preferences-desktop-gaming -a "GameMode"
end=notify-send "GameMode Inactive" "System returned to standard power profile." -i preferences-desktop-gaming -a "GameMode"
script_timeout=5
